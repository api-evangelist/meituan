name: Meituan
description: 'Meituan (美团) is a Chinese technology-retail company operating one of the world''s largest
  on-demand local-services and food-delivery super-apps. Its platform spans restaurant food delivery,
  in-store dining and group buying (Dianping), grocery and instant retail, hotel and travel booking,
  bike and moped sharing, and payments. Meituan runs a partner/developer cooperation center exposing
  merchant, delivery/logistics, and local-services integration APIs to business partners; these are
  partner-gated and documented in Chinese, with no public OpenAPI specification, SDK registry, or
  self-serve developer signup surfaced at this time.'
